<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title>Вариант 5 — Силуэты игроков</title>
  <style>
    *, *::before, *::before { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    canvas { position: fixed; inset: 0; z-index: 0; }
    #frame { position: fixed; inset: 0; border: 20px solid #0c2461; z-index: 200; pointer-events: none; border-radius: 4px; }
    #frame::after { content: ''; position: absolute; inset: 3px; border: 1.5px solid rgba(99,157,255,0.4); border-radius: 2px; }
    .card { position: relative; z-index: 10; width: 100%; max-width: 480px; margin: 24px; background: rgba(255,255,255,0.93); backdrop-filter: blur(20px); border-radius: 28px; border: 1px solid rgba(255,255,255,0.8); padding: 48px 48px 38px; box-shadow: 0 32px 80px rgba(10,36,99,0.4), 0 0 0 1px rgba(59,130,246,0.1); }
    .logo-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 32px; gap: 12px; }
    .logo-box { width: 100px; height: 100px; border-radius: 26px; background: linear-gradient(145deg, #e0eeff, #c7d9f8); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(147,197,253,0.6); box-shadow: 0 8px 24px rgba(37,99,235,0.18); }
    h1 { font-size: 26px; font-weight: 800; color: #1e3a8a; }
    .tag { font-size: 11px; font-weight: 600; color: #3b82f6; background: #eff6ff; border: 1px solid #bfdbfe; padding: 3px 12px; border-radius: 20px; }
    .field-group { margin-bottom: 18px; }
    label { display: block; font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
    input { width: 100%; padding: 13px 16px; border-radius: 14px; border: 1.5px solid #e2e8f0; background: #f8fafc; font-size: 15px; color: #0f172a; outline: none; font-family: inherit; transition: border-color .2s, box-shadow .2s; }
    input:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 4px rgba(59,130,246,0.12); }
    input::placeholder { color: #94a3b8; }
    .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 16px; font-size: 11px; color: #cbd5e1; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
    .btn { width: 100%; padding: 15px; border-radius: 16px; border: none; cursor: pointer; font-size: 15px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%); box-shadow: 0 4px 20px rgba(29,78,216,0.4); transition: transform .15s; }
    .btn:hover { transform: translateY(-1px); }
    .footer-tags { display: flex; justify-content: center; gap: 16px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #f1f5f9; }
    .footer-tags span { font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="frame"></div>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-box"><span style="font-size:52px">⚽</span></div>
      <h1>FootballAcademy</h1>
      <span class="tag">⚽ Твой путь к большому футболу!</span>
    </div>
    <form onsubmit="return false">
      <div class="field-group"><label>Электронная почта</label><input type="email" placeholder="example@sport.ru"/></div>
      <div class="field-group"><label>Пароль</label><input type="password" placeholder="••••••••"/></div>
      <div class="divider">войти в систему</div>
      <button class="btn">⚽&nbsp; Войти</button>
    </form>
    <div class="footer-tags"><span>🥅 Забивай голы</span><span>📈 Рости с нами</span><span>🌟 Стань лучшим</span></div>
  </div>
  <script>
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d')
    let W, H, t = 0
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight }
    resize(); window.addEventListener('resize', resize)

    // ── Игроки ────────────────────────────────────────────────
    // scale: размер фигурки относительно высоты экрана
    // lane: фиксированная Y-полоса (0..1)
    // dir: направление бега (-1 влево, 1 вправо)
    function makePlayer() {
      const dir = Math.random() > 0.5 ? 1 : -1
      const scale = 0.055 + Math.random() * 0.04
      return {
        x: dir === 1 ? -0.1 : 1.1,
        lane: 0.15 + Math.random() * 0.7,
        speed: (0.0008 + Math.random() * 0.001) * dir,
        scale,
        phase: Math.random() * Math.PI * 2,   // фаза анимации бега
        runSpeed: 4 + Math.random() * 3,       // скорость анимации ног
        alpha: 0.18 + Math.random() * 0.22,
        dir,
        hasBall: Math.random() < 0.25,         // у некоторых мяч
      }
    }

    const players = Array.from({ length: 11 }, makePlayer)

    // ── Рисуем силуэт игрока ──────────────────────────────────
    // cx,cy — центр таза, h — высота фигурки
    function drawPlayer(cx, cy, h, animT, dir, alpha, hasBall) {
      ctx.save()
      ctx.globalAlpha = alpha
      ctx.fillStyle = 'rgba(10,30,80,1)'
      ctx.strokeStyle = 'rgba(10,30,80,1)'
      ctx.lineCap = 'round'
      ctx.lineJoin = 'round'

      const s = h / 100  // масштаб: h пикселей = 100 единиц

      // пропорции (в единицах)
      const headR   = 9
      const torsoH  = 26
      const legH    = 32
      const armH    = 24
      const lw      = h * 0.09  // толщина линий

      // анимация бега — маятник ног и рук
      const legSwing  = Math.sin(animT) * 28        // градусы
      const armSwing  = Math.sin(animT + Math.PI) * 22

      // ── голова ──
      ctx.beginPath()
      ctx.arc(cx, cy - (torsoH + headR + 2) * s, headR * s, 0, Math.PI * 2)
      ctx.fill()

      // ── туловище ──
      ctx.beginPath()
      ctx.moveTo(cx, cy - torsoH * s)
      ctx.lineTo(cx, cy)
      ctx.lineWidth = lw * 1.4
      ctx.stroke()

      // ── ноги ──
      function leg(sign) {
        const angle = (legSwing * sign) * Math.PI / 180
        const kx = cx + Math.sin(angle) * legH * 0.5 * s
        const ky = cy + Math.cos(angle) * legH * 0.5 * s
        // бедро
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(kx, ky)
        ctx.lineWidth = lw; ctx.stroke()
        // голень — обратный угол для колена
        const shinAngle = angle - (legSwing * sign * 0.6) * Math.PI / 180
        const fx = kx + Math.sin(shinAngle) * legH * 0.5 * s
        const fy = ky + Math.cos(shinAngle) * legH * 0.5 * s
        ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy)
        ctx.lineWidth = lw * 0.85; ctx.stroke()
        return [fx, fy]
      }
      const [rfx, rfy] = leg(1)
      leg(-1)

      // ── руки ──
      function arm(sign) {
        const angle = (armSwing * sign) * Math.PI / 180
        const ex = cx + Math.sin(angle) * armH * 0.55 * s * dir
        const ey = (cy - torsoH * s) + Math.cos(angle) * armH * 0.55 * s + armH * 0.1 * s
        ctx.beginPath()
        ctx.moveTo(cx, (cy - torsoH * s) + armH * 0.1 * s)
        ctx.lineTo(ex, ey)
        ctx.lineWidth = lw * 0.8; ctx.stroke()
        // предплечье
        const fa = angle + (armSwing * sign * 0.5) * Math.PI / 180
        const fx2 = ex + Math.sin(fa) * armH * 0.45 * s * dir
        const fy2 = ey + Math.cos(fa) * armH * 0.45 * s
        ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(fx2, fy2)
        ctx.lineWidth = lw * 0.65; ctx.stroke()
      }
      arm(1); arm(-1)

      // ── мяч у ноги ──
      if (hasBall) {
        const br = h * 0.09
        ctx.beginPath()
        ctx.arc(rfx + dir * br * 1.2, rfy - br * 0.3, br, 0, Math.PI * 2)
        ctx.globalAlpha = alpha * 0.9
        ctx.fillStyle = '#e8e8e8'; ctx.fill()
        ctx.strokeStyle = '#333'; ctx.lineWidth = br * 0.25; ctx.stroke()
        // пятно на мяче
        ctx.beginPath(); ctx.arc(rfx + dir * br * 1.2 - br*0.2, rfy - br*0.5, br*0.3, 0, Math.PI*2)
        ctx.fillStyle = '#222'; ctx.fill()
      }

      ctx.restore()
    }

    // ── Поле ──────────────────────────────────────────────────
    function drawField() {
      const sw = W / 10
      for (let i = 0; i < 10; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#0d2e0a' : '#0f3410'
        ctx.fillRect(i * sw, 0, sw, H)
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.45)'
      ctx.lineWidth = 1.8
      const p = Math.min(W,H)*0.06, fw = W-p*2, fh = H-p*2
      ctx.strokeRect(p,p,fw,fh)
      ctx.beginPath(); ctx.moveTo(W/2,p); ctx.lineTo(W/2,p+fh); ctx.stroke()
      const cr = Math.min(fw,fh)*0.12
      ctx.beginPath(); ctx.arc(W/2,H/2,cr,0,Math.PI*2); ctx.stroke()
      ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.arc(W/2,H/2,4,0,Math.PI*2); ctx.fill()
      const bw=fw*0.12,bh=fh*0.38
      ctx.strokeRect(p,H/2-bh/2,bw,bh); ctx.strokeRect(p+fw-bw,H/2-bh/2,bw,bh)
      const gw=fw*0.025,gh=fh*0.16
      ctx.strokeRect(p-gw,H/2-gh/2,gw,gh); ctx.strokeRect(p+fw,H/2-gh/2,gw,gh)
      const ar=Math.min(fw,fh)*0.03
      ;[[p,p,0],[p+fw,p,Math.PI/2],[p,p+fh,-Math.PI/2],[p+fw,p+fh,Math.PI]].forEach(([cx,cy,sa])=>{
        ctx.beginPath(); ctx.arc(cx,cy,ar,sa,sa+Math.PI/2); ctx.stroke()
      })
      ctx.beginPath(); ctx.arc(p+fw*0.09,H/2,4,0,Math.PI*2); ctx.fill()
      ctx.beginPath(); ctx.arc(p+fw*0.91,H/2,4,0,Math.PI*2); ctx.fill()
    }

    function loop() {
      t += 0.016
      ctx.clearRect(0,0,W,H)
      drawField()

      for (const p of players) {
        p.x += p.speed
        // вышел за экран — перезапустить с другой стороны
        if (p.dir === 1 && p.x > 1.15) Object.assign(p, makePlayer(), { dir: 1, x: -0.1, speed: Math.abs(p.speed) })
        if (p.dir === -1 && p.x < -0.15) Object.assign(p, makePlayer(), { dir: -1, x: 1.1, speed: -Math.abs(p.speed) })

        const h = p.scale * H
        const cx = p.x * W
        const cy = p.lane * H
        const animT = t * p.runSpeed + p.phase

        // тень
        ctx.save()
        ctx.globalAlpha = p.alpha * 0.3
        ctx.fillStyle = '#000'
        ctx.beginPath()
        ctx.ellipse(cx, cy + h * 0.38, h * 0.18, h * 0.05, 0, 0, Math.PI*2)
        ctx.fill()
        ctx.restore()

        drawPlayer(cx, cy, h, animT, p.dir, p.alpha, p.hasBall)
      }

      requestAnimationFrame(loop)
    }
    loop()
  </script>
</body>
</html>
