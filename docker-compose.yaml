services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: FootballAcademy_backend
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Redis__Host: "redis"
      OpenAI__ApiKey: "${OPENAI_API_KEY}"
    volumes:
      - images_data:/app/wwwroot/images
      - ./backend/FootballAcademy/knowledge:/app/knowledge
      - ./backend/FootballAcademy/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: FootballAcademy_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - appnet

  # =====================================================
